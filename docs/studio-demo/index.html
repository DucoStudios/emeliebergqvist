<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8f3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Emelies studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Prototyp av Emelies studio: bara gränssnitt med exempeldata, inget sparas eller skickas. */
:root {
  --gradde: #f8f3f0; --linne: #f1e3e1; --puder: #e8cfcd; --rosa: #a8606b; --rosa-mork: #864853;
  --mauve: #9a6a6f; --svart: #3a2a2d; --text: #4a3d40; --dampad: #7d6c6f; --linje: #e6d6d3; --vit: #fffefb;
  --gron: #5f7f62; --rubrik: "Cormorant Garamond", Georgia, serif; --brod: "Inter", system-ui, -apple-system, sans-serif;
  --nedre: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--gradde); color: var(--text); font: 400 16px/1.5 var(--brod); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
img { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--rubrik); color: var(--svart); font-weight: 500; margin: 0; line-height: 1.1; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(96px + var(--nedre)); }
.demo { margin: 0 -16px; background: var(--svart); color: #f1e3e1; font-size: .78rem; text-align: center; padding: 6px 16px; }
.topp { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 8px; }
.topp h1 { font-size: 2rem; }
.topp .hej { font-size: .85rem; color: var(--dampad); }
.avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--vit); box-shadow: 0 2px 8px rgba(58,42,45,.12); }

.vy { display: none; animation: in .25s ease; }
.vy.aktiv { display: block; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rubrikrad { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
.rubrikrad h2 { font-size: 1.45rem; }
.rubrikrad span { font-size: .82rem; color: var(--dampad); }
.tom { text-align: center; color: var(--dampad); padding: 28px 12px; background: var(--vit); border-radius: 16px; border: 1px dashed var(--linje); }

/* kort */
.kort { background: var(--vit); border-radius: 18px; box-shadow: 0 1px 2px rgba(58,42,45,.05), 0 6px 20px rgba(58,42,45,.06); margin-bottom: 12px; overflow: hidden; width: 100%; text-align: left; display: block; }
.kort-rad { display: flex; gap: 14px; align-items: center; padding: 12px; }
.tumme { width: 64px; height: 64px; border-radius: 12px; flex: none; object-fit: cover; background: var(--linne); display: grid; place-items: center; font-size: 1.4rem; color: var(--rosa); }
.kort-text { min-width: 0; flex: 1; }
.kort-text b { display: block; color: var(--svart); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kort-text small { color: var(--dampad); font-size: .82rem; }
.pil { color: var(--puder); font-size: 1rem; }
.tagg { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--linne); color: var(--rosa-mork); margin-bottom: 3px; }
.tagg.gron { background: #e3ebe2; color: var(--gron); }

/* pågår */
.pagar { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; }
.pagar::-webkit-scrollbar { display: none; }
.pagar .kort { width: 78%; flex: none; scroll-snap-align: start; margin: 0; }
.stapel { height: 6px; background: var(--linne); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.stapel i { display: block; height: 100%; background: var(--rosa); border-radius: 9px; transition: width .4s; }

/* ladda upp */
.stora { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stor { background: var(--vit); border-radius: 20px; padding: 22px 14px; text-align: center; box-shadow: 0 6px 20px rgba(58,42,45,.06); display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.stor .ikon { width: 54px; height: 54px; border-radius: 50%; background: var(--linne); display: grid; place-items: center; font-size: 1.35rem; color: var(--rosa); }
.stor b { color: var(--svart); }
.stor small { color: var(--dampad); font-size: .78rem; line-height: 1.3; }
.stor input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* knappar */
.knapp { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 0 20px; white-space: nowrap; border-radius: 99px; background: var(--rosa); color: #fff; font-weight: 600; font-size: 1rem; }
.knapp:active { transform: scale(.98); }
.knapp.ljus { background: var(--vit); color: var(--rosa-mork); border: 1.5px solid var(--puder); }
.knapp.gron { background: var(--gron); }
.knapp[disabled] { opacity: .45; }
.knapprad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* formulär */
label.falt { display: block; margin-bottom: 14px; }
label.falt span { display: block; font-size: .85rem; font-weight: 600; color: var(--svart); margin-bottom: 6px; }
.inmatning { width: 100%; border: 1.5px solid var(--linje); background: var(--vit); border-radius: 14px; padding: 14px; font-size: 16px; outline: none; }
.inmatning:focus { border-color: var(--rosa); }
textarea.inmatning { resize: none; min-height: 110px; line-height: 1.55; }
textarea.lang { min-height: 42vh; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 99px; background: var(--vit); border: 1.5px solid var(--linje); font-size: .9rem; }
.chip.vald { background: var(--rosa); border-color: var(--rosa); color: #fff; }
.filrad { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--vit); border-radius: 14px; margin-bottom: 8px; font-size: .9rem; }
.filrad .namn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filrad .stapel { width: 70px; margin: 0; }
.bock { color: var(--gron); font-weight: 700; }

/* nedre meny */
.meny { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,254,251,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--linje); padding: 6px 8px calc(6px + var(--nedre)); z-index: 20; }
.meny-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.flik { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: .72rem; font-weight: 500; color: var(--dampad); position: relative; }
.flik svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.flik.aktiv { color: var(--rosa-mork); }
.flik.aktiv svg { stroke-width: 2.1; }
.flik.mitt .rund { width: 52px; height: 52px; margin-top: -22px; border-radius: 50%; background: var(--rosa); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(168,96,107,.4); }
.flik.mitt .rund svg { stroke: #fff; }
.bricka { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 19px; height: 19px; border-radius: 99px; background: var(--rosa); color: #fff; font-size: .7rem; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--vit); }
.bricka:empty { display: none; }

/* blad (detaljvy) */
.blad { position: fixed; inset: 0; background: var(--gradde); z-index: 40; overflow-y: auto; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.blad.oppen { transform: none; }
.blad-inner { max-width: 520px; margin: 0 auto; padding: 0 16px calc(130px + var(--nedre)); }
.blad-topp { position: sticky; top: 0; background: var(--gradde); display: flex; align-items: center; gap: 10px; padding: 14px 0; z-index: 2; }
.blad-topp button { width: 40px; height: 40px; border-radius: 50%; background: var(--vit); font-size: 1.2rem; box-shadow: 0 2px 8px rgba(58,42,45,.08); }
.blad-topp h2 { font-size: 1.35rem; flex: 1; }
.blad-fot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + var(--nedre)); background: linear-gradient(transparent, var(--gradde) 30%); z-index: 3; }
.blad-fot .knapprad { max-width: 488px; margin: 0 auto; }

/* spelare */
.spelare { background: var(--vit); border-radius: 20px; padding: 18px; box-shadow: 0 6px 20px rgba(58,42,45,.06); }
.omslag { width: 100%; aspect-ratio: 1; border-radius: 14px; object-fit: cover; margin-bottom: 14px; }
.omslag-wrap { position: relative; }
.omslag-wrap .poddnamn { position: absolute; left: 14px; bottom: 26px; right: 14px; color: #fff; font-family: var(--rubrik); font-size: 1.8rem; line-height: 1.05; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
.reglage { display: flex; align-items: center; gap: 14px; }
.spela { width: 56px; height: 56px; border-radius: 50%; background: var(--rosa); color: #fff; display: grid; place-items: center; flex: none; font-size: 1.3rem; }
.tid { font-size: .78rem; color: var(--dampad); display: flex; justify-content: space-between; margin-top: 4px; }
.vag { height: 34px; display: flex; align-items: center; gap: 2px; flex: 1; }
.vag i { flex: 1; background: var(--puder); border-radius: 2px; }
.vag i.spelad { background: var(--rosa); }
.kapitel { margin-top: 14px; border-top: 1px solid var(--linje); padding-top: 10px; font-size: .9rem; }
.kapitel div { display: flex; gap: 10px; padding: 6px 0; }
.kapitel span { color: var(--rosa-mork); font-variant-numeric: tabular-nums; width: 42px; flex: none; }
.text-block { background: var(--vit); border-radius: 18px; padding: 16px; margin-top: 12px; font-size: .95rem; }
.text-block h3 { font-family: var(--brod); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--mauve); margin-bottom: 6px; font-weight: 600; }

.reel { position: relative; width: 78%; margin: 0 auto; aspect-ratio: 9/16; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(58,42,45,.2); }
.reel img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); }
.reel.spelar img { animation: kb 8s ease-in-out infinite alternate; }
@keyframes kb { to { transform: scale(1.12) translateY(-2%); } }
.reel .textning { position: absolute; left: 10%; right: 10%; bottom: 22%; text-align: center; color: #fff; font-weight: 600; font-size: 1.05rem; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.reel .textning mark { background: var(--rosa); color: #fff; padding: 0 4px; border-radius: 4px; }
.reel .spela { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,.85); color: var(--rosa-mork); }
.reel.spelar .spela { opacity: 0; }
.ljudtips { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--linne); font-size: .88rem; }

.karusell { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.karusell::-webkit-scrollbar { display: none; }
.slide { flex: none; width: 86%; aspect-ratio: 4/5; border-radius: 16px; overflow: hidden; position: relative; scroll-snap-align: center; background: var(--linne); }
.slide img { width: 100%; height: 100%; object-fit: cover; }
.slide .over { position: absolute; inset: auto 0 0 0; padding: 22px 18px; background: linear-gradient(transparent, rgba(58,42,45,.75)); color: #fff; font-family: var(--rubrik); font-size: 1.6rem; line-height: 1.1; }
.slide.textslide { background: var(--puder); display: grid; place-items: center; padding: 26px; text-align: center; font-family: var(--rubrik); font-size: 1.7rem; color: var(--svart); line-height: 1.15; }
.prickar { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.prickar i { width: 6px; height: 6px; border-radius: 50%; background: var(--puder); }
.prickar i.pa { background: var(--rosa); }

.brev { background: var(--vit); border-radius: 18px; padding: 22px 18px; font-size: .97rem; line-height: 1.65; box-shadow: 0 6px 20px rgba(58,42,45,.06); }
.brev .amne { font-size: .8rem; color: var(--dampad); border-bottom: 1px solid var(--linje); padding-bottom: 10px; margin-bottom: 14px; }
.brev h3 { font-size: 1.6rem; margin-bottom: 10px; }
.brev img { border-radius: 12px; margin: 12px 0; }

.andra { display: none; margin-top: 14px; }
.andra.syns { display: block; }
.mik { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .88rem; color: var(--rosa-mork); font-weight: 600; }
.mik i { width: 36px; height: 36px; border-radius: 50%; background: var(--linne); display: grid; place-items: center; font-style: normal; }
.mik.spelar i { background: var(--rosa); color: #fff; animation: puls 1s infinite; }
@keyframes puls { 50% { box-shadow: 0 0 0 8px rgba(168,96,107,.18); } }

.toast { position: fixed; left: 50%; bottom: calc(96px + var(--nedre)); transform: translate(-50%, 20px); background: var(--svart); color: #fff; padding: 12px 18px; border-radius: 99px; font-size: .9rem; opacity: 0; transition: .25s; z-index: 60; white-space: nowrap; pointer-events: none; }
.toast.syns { opacity: 1; transform: translate(-50%, 0); }
.liten { font-size: .82rem; color: var(--dampad); }
.mellan { height: 14px; }
.segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--linne); border-radius: 99px; padding: 4px; margin-bottom: 14px; }
.segment button { padding: 10px; border-radius: 99px; font-weight: 600; font-size: .9rem; color: var(--dampad); }
.segment button.vald { background: var(--vit); color: var(--rosa-mork); box-shadow: 0 1px 4px rgba(58,42,45,.1); }
.bildrad { display: flex; gap: 8px; flex-wrap: wrap; }
.bildrad img, .bildrad label { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
.bildrad label { border: 1.5px dashed var(--puder); display: grid; place-items: center; color: var(--rosa); font-size: 1.6rem; position: relative; }
.bildrad label input { position: absolute; inset: 0; opacity: 0; }
.sparat { font-size: .78rem; color: var(--gron); text-align: right; min-height: 1.2em; }
</style>
</head>
<body>
<div class="app">
  <div class="demo">Förhandsvisning med exempeldata. Inget laddas upp eller skickas.</div>
  <header class="topp">
    <div><div class="hej" id="halsning">God morgon</div><h1>Emelies studio</h1></div>
    <img class="avatar" src="../bilder/emelie-kavaj.jpg" alt="">
  </header>

  <!-- GRANSKA -->
  <section class="vy aktiv" id="vy-granska">
    <div class="rubrikrad"><h2>Klart att granska</h2><span id="antal-granska"></span></div>
    <div id="lista-granska"></div>
    <div class="rubrikrad"><h2>Jag jobbar med</h2><span>Jean-Claude</span></div>
    <div class="pagar" id="lista-pagar"></div>
  </section>

  <!-- LADDA UPP -->
  <section class="vy" id="vy-ladda">
    <div class="rubrikrad"><h2>Ladda upp</h2><span>Hamnar på Google Drive</span></div>
    <div class="stora">
      <label class="stor"><span class="ikon"><span class="fa-solid fa-microphone-lines"></span></span><b>Ljud</b><small>Poddinspelning</small><input type="file" accept="audio/*" data-typ="ljud" multiple></label>
      <label class="stor"><span class="ikon"><span class="fa-solid fa-video"></span></span><b>Video</b><small>Till Reels</small><input type="file" accept="video/*" data-typ="video" multiple></label>
      <label class="stor"><span class="ikon"><span class="fa-solid fa-images"></span></span><b>Bilder</b><small>Karuseller och blogg</small><input type="file" accept="image/*" data-typ="bilder" multiple></label>
      <label class="stor"><span class="ikon"><span class="fa-solid fa-file-lines"></span></span><b>Dokument</b><small>Anteckningar, avtal</small><input type="file" data-typ="dokument" multiple></label>
    </div>
    <div id="uppladdning" hidden>
      <div class="rubrikrad"><h2>Dina filer</h2><span id="filantal"></span></div>
      <div id="filer"></div>
      <label class="falt"><span>Vad vill du att jag gör?</span>
        <div class="chips" id="gora">
          <button class="chip" data-v="Poddavsnitt">Poddavsnitt</button>
          <button class="chip" data-v="Reel">Reel</button>
          <button class="chip" data-v="Karusell">Karusell</button>
          <button class="chip" data-v="Blogginlägg">Blogginlägg</button>
          <button class="chip" data-v="Bara spara">Bara spara</button>
        </div>
      </label>
      <label class="falt"><span>Berätta kort (frivilligt)</span>
        <textarea class="inmatning" id="beskrivning" placeholder="T.ex. avsnitt 3 med Anna, om att flytta till Frankrike med barn"></textarea>
      </label>
      <button class="knapp" id="skicka-upp" disabled>Skicka till Jean-Claude</button>
    </div>
  </section>

  <!-- SKRIV -->
  <section class="vy" id="vy-skriv">
    <div class="rubrikrad"><h2>Skriv</h2><span>Sparas automatiskt</span></div>
    <div class="knapprad">
      <button class="knapp" data-ny="Nyhetsbrev"><span class="fa-solid fa-plus"></span> Nyhetsbrev</button>
      <button class="knapp ljus" data-ny="Blogginlägg"><span class="fa-solid fa-plus"></span> Blogginlägg</button>
    </div>
    <div class="rubrikrad"><h2>Utkast</h2><span></span></div>
    <div id="lista-utkast"></div>
  </section>

  <!-- PUBLICERAT -->
  <section class="vy" id="vy-klart">
    <div class="rubrikrad"><h2>Publicerat</h2><span>Senaste först</span></div>
    <div id="lista-klart"></div>
  </section>
</div>

<nav class="meny"><div class="meny-inner">
  <button class="flik aktiv" data-vy="granska"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Granska<span class="bricka" id="bricka"></span></button>
  <button class="flik mitt" data-vy="ladda"><span class="rund"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>Ladda upp</button>
  <button class="flik" data-vy="skriv"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Skriv</button>
  <button class="flik" data-vy="klart"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>Publicerat</button>
</div></nav>

<div class="blad" id="blad"><div class="blad-inner">
  <div class="blad-topp"><button id="stang" aria-label="Stäng"><span class="fa-solid fa-xmark"></span></button><h2 id="blad-rubrik"></h2></div>
  <div id="blad-innehall"></div>
</div><div class="blad-fot" id="blad-fot"></div></div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var B = "../bilder/";
  var granska = [
    { id: 1, typ: "podd", tagg: "Poddavsnitt", titel: "Avsnitt 1: Varför vi flyttade till Frankrike", sub: "42 min · klart i morse", bild: B + "emelie-spegel.jpg",
      kapitel: [["00:00", "Intro"], ["02:15", "Beslutet vi tog vid köksbordet"], ["14:40", "Första vintern i Languedoc"], ["29:05", "Barnen och skolan"], ["38:30", "Vad jag hade gjort annorlunda"]],
      beskrivning: "Hur kom det sig att en svensk familj sålde huset och flyttade till södra Frankrike? I första avsnittet berättar jag om beslutet, den första vintern och vad som blev helt annorlunda än vi trodde.",
      gjort: "Jämnat ut ljudnivån, tagit bort brus och tre långa pauser, lagt på intro och outro." },
    { id: 2, typ: "reel", tagg: "Reel", titel: "Morgon på marknaden i Narbonne", sub: "0:24 · gjord av din video från tisdag", bild: B + "granden.jpg",
      textning: ["Tisdag morgon i <mark>Narbonne</mark>", "Färska fikon för 3 €", "Det här saknade jag i Sverige"],
      caption: "Tisdagsmarknaden är min favoritstund i veckan. Vad skulle du köpa först?\n\n#livetifrankrike #narbonne #bonjourlife",
      ljud: "Lugn akustisk gitarr eller ett franskt chanson-ljud som trendar. Lägg till det i Instagram när du publicerar." },
    { id: 3, typ: "karusell", tagg: "Karusell", titel: "5 saker ingen säger om att flytta till Frankrike", sub: "6 bilder", bild: B + "landskap.jpg",
      slides: [{ t: "5 saker ingen säger om att flytta till Frankrike", text: true }, { b: B + "kakel.jpg", t: "1. Allt tar tre gånger längre tid" }, { b: B + "oleander.jpg", t: "2. Grannarna blir din familj" }, { b: B + "palm.jpg", t: "3. Lunchen är helig" }, { b: B + "vandring.jpg", t: "4. Du börjar gå överallt" }, { t: "Spara inlägget och skicka till någon som drömmer om Frankrike", text: true }],
      caption: "Nummer två överraskade mig mest. Vilken känner du igen dig i?" },
    { id: 4, typ: "brev", tagg: "Nyhetsbrev", titel: "Nytt avsnitt: varför vi flyttade", sub: "Till prenumeranterna", bild: B + "emelie-luckor.jpg",
      amne: "Ämne: Den kvällen vi bestämde oss",
      text: "Hej!\n\nDet var en vanlig tisdag när vi satt vid köksbordet och plötsligt sa det högt: tänk om vi faktiskt gör det?\n\nI veckans avsnitt av podden berättar jag hela historien. Om beslutet, om den kalla första vintern och om vad som blev bättre än jag någonsin vågat hoppas.\n\nLyssna på Spotify eller direkt på hemsidan.\n\nVarma hälsningar från Languedoc,\nEmelie" }
  ];
  var pagar = [
    { tagg: "Reel", titel: "Vandring i vingårdarna", sub: "Klipper och textar", p: 60, bild: B + "vandring.jpg" },
    { tagg: "Poddavsnitt", titel: "Avsnitt 2 (råinspelning)", sub: "Jämnar ut ljudet", p: 25, ikon: "microphone-lines" },
    { tagg: "Blogginlägg", titel: "Vår första vinter", sub: "Putsar språket", p: 80, bild: B + "kanalen.jpg" }
  ];
  var klart = [
    { tagg: "Nyhetsbrev", titel: "Välkommen till mitt nyhetsbrev", sub: "Skickat 20 okt", var: "Nyhetsbrevet", bild: B + "emelie-kavaj.jpg" },
    { tagg: "Reel", titel: "Fönsterluckorna får ny färg", sub: "Godkänd 18 okt", var: "Redo för Instagram", bild: B + "emelie-luckor.jpg" }
  ];
  var utkast = [{ typ: "Blogginlägg", titel: "Det jag lärt mig om franska skolan", text: "När vi kom hit trodde jag att", andrad: "i går" }];

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var timme = new Date().getHours();
  $("#halsning").textContent = timme < 10 ? "God morgon, Emelie" : timme < 17 ? "Hej Emelie" : "God kväll, Emelie";

  function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("syns"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("syns"); }, 2400); }
  function tumme(x) { return x.bild ? '<img class="tumme" src="' + x.bild + '" alt="">' : '<span class="tumme"><span class="fa-solid fa-' + (x.ikon || "file-lines") + '"></span></span>'; }
  function kort(x, extra) {
    return '<div class="kort-rad">' + tumme(x) + '<div class="kort-text"><span class="tagg' + (extra === "gron" ? " gron" : "") + '">' + esc(x.tagg) + "</span><b>" + esc(x.titel) + "</b><small>" + esc(x.sub) + "</small>" + (extra && extra !== "gron" ? extra : "") + "</div>" + (extra ? "" : '<span class="pil"><span class="fa-solid fa-chevron-right"></span></span>') + "</div>";
  }

  function rita() {
    $("#lista-granska").innerHTML = granska.length ? granska.map(function (x) { return '<button class="kort" data-id="' + x.id + '">' + kort(x) + "</button>"; }).join("") : '<div class="tom">Allt är granskat<br><span class="liten">Jag hör av mig när nästa sak är klar.</span></div>';
    $("#antal-granska").textContent = granska.length ? granska.length + " väntar på dig" : "";
    $("#bricka").textContent = granska.length || "";
    $("#lista-pagar").innerHTML = pagar.length ? pagar.map(function (x) { return '<div class="kort">' + kort(x, '<div class="stapel"><i style="width:' + x.p + '%"></i></div>') + "</div>"; }).join("") : '<div class="tom" style="width:100%">Inget just nu</div>';
    $("#lista-klart").innerHTML = klart.map(function (x) { return '<div class="kort">' + kort({ tagg: x.var, titel: x.titel, sub: x.tagg + " · " + x.sub, bild: x.bild, ikon: x.ikon }, "gron") + "</div>"; }).join("");
    $("#lista-utkast").innerHTML = utkast.length ? utkast.map(function (u, i) { return '<button class="kort" data-utkast="' + i + '">' + kort({ tagg: u.typ, titel: u.titel || "Utan rubrik", sub: "Ändrat " + u.andrad, ikon: u.typ === "Nyhetsbrev" ? "envelope-open-text" : "pen-nib" }) + "</button>"; }).join("") : '<div class="tom">Inga utkast</div>';
  }

  // flikar
  function visa(vy) {
    document.querySelectorAll(".vy").forEach(function (v) { v.classList.toggle("aktiv", v.id === "vy-" + vy); });
    document.querySelectorAll(".flik").forEach(function (f) { f.classList.toggle("aktiv", f.dataset.vy === vy); });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".flik").forEach(function (f) { f.addEventListener("click", function () { visa(f.dataset.vy); }); });

  // blad
  var blad = $("#blad");
  function oppna(rubrik, html, fot) { $("#blad-rubrik").textContent = rubrik; $("#blad-innehall").innerHTML = html; $("#blad-fot").innerHTML = fot || ""; blad.scrollTop = 0; blad.classList.add("oppen"); document.body.style.overflow = "hidden"; }
  function stang() { blad.classList.remove("oppen"); document.body.style.overflow = ""; clearInterval(spelTimer); }
  $("#stang").addEventListener("click", stang);

  var spelTimer;
  function spelare(x) {
    var staplar = ""; for (var i = 0; i < 48; i++) staplar += '<i style="height:' + (20 + Math.abs(Math.sin(i * 1.7) * 60 + Math.sin(i * .4) * 20)) + '%"></i>';
    return '<div class="spelare"><div class="omslag-wrap"><img class="omslag" src="' + x.bild + '" alt=""><div class="poddnamn">Poddens namn<br><em style="font-size:1.1rem">med Emelie Bergqvist</em></div></div>' +
      '<div class="reglage"><button class="spela" id="spela"><span class="fa-solid fa-play"></span></button><div style="flex:1"><div class="vag" id="vag">' + staplar + '</div><div class="tid"><span id="tid">0:00</span><span>42:10</span></div></div></div>' +
      '<div class="kapitel">' + x.kapitel.map(function (k) { return "<div><span>" + k[0] + "</span>" + esc(k[1]) + "</div>"; }).join("") + "</div></div>" +
      '<div class="text-block"><h3>Beskrivning till Spotify</h3>' + esc(x.beskrivning) + "</div>" +
      '<div class="text-block"><h3>Det här har jag gjort</h3>' + esc(x.gjort) + "</div>";
  }
  function reel(x) {
    return '<div class="reel" id="reel"><img src="' + x.bild + '" alt=""><div class="textning" id="textning">' + x.textning[0] + '</div><button class="spela" id="spela"><span class="fa-solid fa-play"></span></button></div>' +
      '<div class="ljudtips"><span class="fa-solid fa-music"></span> <b>Ljud:</b> ' + esc(x.ljud) + "</div>" +
      '<div class="text-block"><h3>Bildtext</h3>' + esc(x.caption).replace(/\n/g, "<br>") + "</div>";
  }
  function karusell(x) {
    return '<div class="karusell" id="karusell">' + x.slides.map(function (s) { return s.text ? '<div class="slide textslide">' + esc(s.t) + "</div>" : '<div class="slide"><img src="' + s.b + '" alt=""><div class="over">' + esc(s.t) + "</div></div>"; }).join("") + "</div>" +
      '<div class="prickar" id="prickar">' + x.slides.map(function (_, i) { return "<i" + (i ? "" : ' class="pa"') + "></i>"; }).join("") + "</div>" +
      '<div class="text-block"><h3>Bildtext</h3>' + esc(x.caption) + "</div>";
  }
  function brev(x) {
    return '<div class="brev"><div class="amne">' + esc(x.amne) + '</div><h3>' + esc(x.titel) + '</h3><img src="' + x.bild + '" alt="">' + esc(x.text).replace(/\n\n/g, "</p><p>").replace(/^/, "<p>").replace(/\n/g, "<br>") + "</p></div>";
  }
  var andraHtml = '<div class="andra" id="andra"><label class="falt"><span>Vad ska jag ändra?</span><textarea class="inmatning" id="andra-text" placeholder="T.ex. klipp bort biten om skolan, och gör titeln kortare"></textarea></label><button class="mik" id="mik"><i><span class="fa-solid fa-microphone"></span></i>Eller tala in det</button></div>';

  document.addEventListener("click", function (e) {
    var k = e.target.closest("[data-id]");
    if (k && k.closest("#lista-granska")) return granskaItem(granska.filter(function (x) { return x.id == k.dataset.id; })[0]);
    var u = e.target.closest("[data-utkast]");
    if (u) return skriv(utkast[u.dataset.utkast], +u.dataset.utkast);
    var n = e.target.closest("[data-ny]");
    if (n) return skriv({ typ: n.dataset.ny, titel: "", text: "" }, -1);
  });

  function granskaItem(x) {
    var html = x.typ === "podd" ? spelare(x) : x.typ === "reel" ? reel(x) : x.typ === "karusell" ? karusell(x) : brev(x);
    var godkann = '<span class="fa-solid fa-check"></span> Godkänn';
    oppna(x.tagg, '<p class="liten" style="margin:0 0 12px">' + esc(x.titel) + "</p>" + html + andraHtml,
      '<div class="knapprad"><button class="knapp ljus" id="b-andra"><span class="fa-solid fa-pen"></span> Ändra</button><button class="knapp gron" id="b-ok">' + godkann + "</button></div>");
    var spelar = false, s = 0;
    var spela = $("#spela");
    if (spela) spela.addEventListener("click", function () {
      spelar = !spelar; spela.innerHTML = '<span class="fa-solid fa-' + (spelar ? "pause" : "play") + '"></span>';
      var r = $("#reel"); if (r) r.classList.toggle("spelar", spelar);
      clearInterval(spelTimer);
      if (spelar) spelTimer = setInterval(function () {
        s++;
        if (x.typ === "podd") { var st = $("#vag").children, p = Math.min(48, Math.floor(s / 1.2)); for (var i = 0; i < 48; i++) st[i].classList.toggle("spelad", i < p); $("#tid").textContent = Math.floor(s * 2 / 60) + ":" + ("0" + (s * 2) % 60).slice(-2); }
        else { $("#textning").innerHTML = x.textning[Math.floor(s / 3) % x.textning.length]; }
      }, 1000);
    });
    var kar = $("#karusell");
    if (kar) kar.addEventListener("scroll", function () { var i = Math.round(kar.scrollLeft / (kar.firstChild.offsetWidth + 10)); document.querySelectorAll("#prickar i").forEach(function (p, j) { p.classList.toggle("pa", i === j); }); });
    $("#b-andra").addEventListener("click", function () {
      var a = $("#andra");
      if (!a.classList.contains("syns")) { a.classList.add("syns"); $("#andra-text").focus(); this.innerHTML = '<span class="fa-solid fa-paper-plane"></span> Skicka'; return; }
      if (!$("#andra-text").value.trim()) return toast("Skriv vad jag ska ändra");
      granska = granska.filter(function (y) { return y !== x; });
      pagar.unshift({ tagg: x.tagg, titel: x.titel, sub: "Gör dina ändringar", p: 10, bild: x.bild });
      stang(); rita(); toast("Tack! Jag gör om det och säger till");
    });
    $("#mik").addEventListener("click", function () { var m = this; m.classList.toggle("spelar"); m.lastChild.textContent = m.classList.contains("spelar") ? "Lyssnar... tryck för att sluta" : "Eller tala in det"; if (!m.classList.contains("spelar")) $("#andra-text").value = "Gör titeln kortare och ta bort biten om skolan."; });
    $("#b-ok").addEventListener("click", function () {
      granska = granska.filter(function (y) { return y !== x; });
      var dit = { podd: "Spotify och Apple", reel: "Redo för Instagram", karusell: "Redo för Instagram", brev: "Nyhetsbrevet" }[x.typ];
      klart.unshift({ tagg: x.tagg, titel: x.titel, sub: "Godkänd nyss", var: dit, bild: x.bild });
      stang(); rita();
      toast(x.typ === "brev" ? "Skickas till dina prenumeranter" : x.typ === "podd" ? "Publiceras på Spotify" : "Godkänd! Ligger i Publicerat");
    });
  }

  // skriv
  function skriv(u, idx) {
    var bilder = (u.bilder || []).map(function (b) { return '<img src="' + b + '" alt="">'; }).join("");
    oppna(u.typ,
      '<div class="segment"><button data-t="Nyhetsbrev"' + (u.typ === "Nyhetsbrev" ? ' class="vald"' : "") + '>Nyhetsbrev</button><button data-t="Blogginlägg"' + (u.typ === "Blogginlägg" ? ' class="vald"' : "") + ">Blogginlägg</button></div>" +
      '<label class="falt"><span>Rubrik</span><input class="inmatning" id="s-titel" value="' + esc(u.titel) + '" placeholder="Vad handlar det om?"></label>' +
      '<label class="falt"><span>Text</span><textarea class="inmatning lang" id="s-text" placeholder="Skriv som du pratar. Jag putsar språket och gör det snyggt.">' + esc(u.text) + "</textarea></label>" +
      '<div class="sparat" id="sparat"></div>' +
      '<label class="falt"><span>Bilder</span></label><div class="bildrad" id="s-bilder">' + bilder + '<label><span class="fa-solid fa-plus"></span><input type="file" accept="image/*" multiple id="s-fil"></label></div>',
      '<div class="knapprad"><button class="knapp ljus" id="s-spara">Spara utkast</button><button class="knapp" id="s-klar">Klar, putsa det</button></div>');
    var typ = u.typ;
    document.querySelectorAll(".segment button").forEach(function (b) { b.addEventListener("click", function () { typ = b.dataset.t; document.querySelectorAll(".segment button").forEach(function (c) { c.classList.toggle("vald", c === b); }); $("#blad-rubrik").textContent = typ; }); });
    var t; ["#s-titel", "#s-text"].forEach(function (s) { $(s).addEventListener("input", function () { $("#sparat").textContent = ""; clearTimeout(t); t = setTimeout(function () { $("#sparat").textContent = "Sparat"; }, 700); }); });
    $("#s-fil").addEventListener("change", function () { var rad = $("#s-bilder"); Array.prototype.forEach.call(this.files, function (f) { var img = document.createElement("img"); img.src = URL.createObjectURL(f); rad.insertBefore(img, rad.lastChild); }); });
    function spara() { var d = { typ: typ, titel: $("#s-titel").value.trim(), text: $("#s-text").value, andrad: "nyss" }; if (idx >= 0) utkast[idx] = d; else utkast.unshift(d); return d; }
    $("#s-spara").addEventListener("click", function () { spara(); stang(); rita(); toast("Utkastet är sparat"); });
    $("#s-klar").addEventListener("click", function () {
      if (!$("#s-text").value.trim()) return toast("Skriv lite text först");
      var d = spara(); utkast = utkast.filter(function (x) { return x !== d; });
      pagar.unshift({ tagg: typ, titel: d.titel || "Utan rubrik", sub: "Putsar språket", p: 15, ikon: typ === "Nyhetsbrev" ? "envelope-open-text" : "pen-nib" });
      stang(); rita(); visa("granska"); toast("Tack! Du får granska det snart");
    });
  }

  // ladda upp
  var valda = [], gora = [];
  document.querySelectorAll(".stor input").forEach(function (inp) {
    inp.addEventListener("change", function () {
      Array.prototype.forEach.call(inp.files, function (f) { valda.push({ namn: f.name, mb: f.size / 1048576, typ: inp.dataset.typ, p: 0 }); });
      inp.value = "";
      var forslag = { ljud: "Poddavsnitt", video: "Reel", bilder: "Karusell", dokument: "Bara spara" }[inp.dataset.typ];
      if (gora.indexOf(forslag) < 0) gora.push(forslag);
      $("#uppladdning").hidden = false; ritaFiler(); ladda();
      setTimeout(function () { $("#uppladdning").scrollIntoView({ behavior: "smooth" }); }, 50);
    });
  });
  function ritaFiler() {
    $("#filantal").textContent = valda.length + (valda.length === 1 ? " fil" : " filer");
    $("#filer").innerHTML = valda.map(function (f) { return '<div class="filrad"><span class="fa-solid fa-' + { ljud: "microphone-lines", video: "video", bilder: "images", dokument: "file-lines" }[f.typ] + '" style="color:var(--rosa)"></span><span class="namn">' + esc(f.namn) + "</span>" + (f.p >= 100 ? '<span class="bock fa-solid fa-check"></span>' : '<div class="stapel"><i style="width:' + f.p + '%"></i></div>') + "</div>"; }).join("");
    document.querySelectorAll("#gora .chip").forEach(function (c) { c.classList.toggle("vald", gora.indexOf(c.dataset.v) >= 0); });
    $("#skicka-upp").disabled = !valda.length || valda.some(function (f) { return f.p < 100; }) || !gora.length;
    $("#skicka-upp").textContent = valda.some(function (f) { return f.p < 100; }) ? "Laddar upp..." : "Skicka till Jean-Claude";
  }
  var laddTimer;
  function ladda() {
    clearInterval(laddTimer);
    laddTimer = setInterval(function () {
      var kvar = false;
      valda.forEach(function (f) { if (f.p < 100) { f.p = Math.min(100, f.p + Math.max(4, 40 / Math.max(1, f.mb / 20))); kvar = true; } });
      ritaFiler(); if (!kvar) clearInterval(laddTimer);
    }, 300);
  }
  document.querySelectorAll("#gora .chip").forEach(function (c) { c.addEventListener("click", function () { var i = gora.indexOf(c.dataset.v); if (i >= 0) gora.splice(i, 1); else gora.push(c.dataset.v); ritaFiler(); }); });
  $("#skicka-upp").addEventListener("click", function () {
    var besk = $("#beskrivning").value.trim();
    gora.filter(function (g) { return g !== "Bara spara"; }).forEach(function (g) { pagar.unshift({ tagg: g, titel: besk || valda[0].namn, sub: "Precis mottaget", p: 5, ikon: { Poddavsnitt: "microphone-lines", Reel: "video", Karusell: "images", "Blogginlägg": "pen-nib" }[g] }); });
    valda = []; gora = []; $("#beskrivning").value = ""; $("#uppladdning").hidden = true;
    rita(); visa("granska"); toast("Tack! Jag sätter igång");
  });

  rita();
})();
</script>
</body>
</html>
